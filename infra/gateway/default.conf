# Public routes (gateway :8080). The client's Host header is forwarded so upstreams build links back
# through the gateway.
#
#   /ogc/    -> ogc:5000         OGC API (pygeoapi): Features, Tiles, OpenAPI          GET/HEAD only, prefix stripped
#   /tiles/  -> tiles:8000       TiTiler, vendor-specific raster routes                GET/HEAD only, prefix stripped
#   /api/    -> processing:8000  custom processing API (clip, zonal statistics, jobs, downloads), prefix stripped
#   /auth/  /admin/  /api/exports  /api/catalog/  /api/app/
#            -> app-api:8000     application API: sessions, admin uploads/publication, exports, public
#                                catalog metadata. Raw URI forwarded (no prefix strip). Optional Compose
#                                profile "app"; without it these routes answer 503 APP_API_UNAVAILABLE.
#   /viewer/ -> viewer:8080      the MapLibre web application
#   /        -> 302 /viewer/
#   /healthz                     gateway liveness (does not check upstreams)
#
# Read-route access (GATEWAY_READ_ACCESS, written at container start by 40-cgis-gateway.sh):
#   public    (default) /ogc/, /tiles/, /api/operations, /api/downloads are anonymous (local demo, CITE)
#   protected           those routes need a signed-in user or a personal access token (nginx auth_request
#                       -> app-api GET /auth/verify); requires the "app" profile. Mutating admin routes are
#                       ALWAYS authenticated and role-checked by the application API itself.
#
# Upstreams are resolved per request through the container DNS server (resolver.conf, written at start),
# so a recreated container (new IP) is picked up without restarting the gateway, and the gateway starts
# even when an optional upstream (app-api) is absent.

include /etc/nginx/cgis/resolver.conf;
resolver_timeout 3s;

# The upstream path is taken from the RAW request URI ($request_uri), not nginx's decoded copy, so
# percent-encoding (e.g. %2F inside an id) and the query string reach the service unchanged.
map $request_uri $upstream_uri {
    "~^/(?:ogc|tiles|api|viewer)(?<rest>/[^?]*(?:\?.*)?)$"  $rest;
    default  "";
}
# Raw dot-segments ("/../", "/./", or their %2e forms) are refused instead of forwarded.
map $request_uri $dot_segment {
    "~*(?:^|/)(?:\.|%2e){1,2}(?:/|\?|$)"  1;
    default  0;
}

server {
    listen 8080 default_server;
    server_name _;

    # Redirects are absolute and built from the client's own Host header (which carries the published
    # port), so they work on any host port. Relative Locations are not followed by QGIS's OGC API -
    # Features provider when a user enters ".../ogc" without the trailing slash.
    absolute_redirect off;

    set $ogc_up        ogc:5000;
    set $tiles_up      tiles:8000;
    set $processing_up processing:8000;
    set $viewer_up     viewer:8080;
    set $app_api_up    app-api:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The real client address (login throttling in the application API). Set at server level: a
    # proxy_set_header inside a location would drop the inherited headers above. Not client-spoofable.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    client_max_body_size 1m;

    if ($dot_segment) {
        return 400 '{"error":{"code":"BAD_PATH","message":"dot-segments are not allowed in paths"}}';
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location = / { return 302 $scheme://$http_host/viewer/; }

    # ------------------------------------------------------------------ read-route access control
    # Used only when GATEWAY_READ_ACCESS=protected (read-access.conf from 40-cgis-gateway.sh).
    location = /_cgis_auth {
        internal;
        proxy_pass http://$app_api_up/auth/verify?require=user;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;   # CSRF is enforced for cookie sessions on POST
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location @cgis_401 {
        default_type application/json;
        add_header WWW-Authenticate 'Bearer realm="cgis"' always;
        return 401 '{"error":{"code":"UNAUTHENTICATED","message":"sign in (cookie session) or send a personal access token"}}';
    }
    location @cgis_403 {
        default_type application/json;
        return 403 '{"error":{"code":"FORBIDDEN","message":"forbidden: method not allowed on this route, or the session lacks the role or X-CSRF-Token"}}';
    }
    location @app_api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"APP_API_UNAVAILABLE","message":"the application API (accounts, admin, exports) is not running; start the Compose profile app"}}';
    }

    # ------------------------------------------------------------------ standards + custom read routes
    location = /ogc { return 301 $scheme://$http_host/ogc/; }
    location /ogc/ {
        limit_except GET { deny all; }      # GET implies HEAD
        include /etc/nginx/cgis/read-access.conf;
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://$ogc_up$upstream_uri;
        proxy_read_timeout 60s;
    }

    location = /tiles { return 301 $scheme://$http_host/tiles/; }
    location /tiles/ {
        limit_except GET { deny all; }
        include /etc/nginx/cgis/read-access.conf;
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://$tiles_up$upstream_uri;
        proxy_read_timeout 60s;
    }

    location = /api { return 301 $scheme://$http_host/api/; }
    # Health of the processing service stays anonymous in both access modes.
    location ~ ^/api/(ready|health)$ {
        limit_except GET { deny all; }
        proxy_pass http://$processing_up/$1;
    }
    location /api/ {
        include /etc/nginx/cgis/read-access.conf;
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://$processing_up$upstream_uri;
        client_max_body_size 1m;            # matches the processing service's MAX_REQUEST_BYTES default
        proxy_read_timeout 150s;            # longer than the synchronous job time limit (large AOIs go async)
    }

    # ------------------------------------------------------------------ application API
    # The service's routes ARE the public paths, so the raw request URI is forwarded unchanged.
    # Authentication, roles, CSRF and Origin checks are enforced by the service on every route.
    location = /auth { return 301 $scheme://$http_host/auth/me; }
    location ^~ /auth/ {
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # Admin uploads (POST /admin/datasets is an alias of /admin/datasets/uploads; GET lists datasets)
    # stream straight to the service's bounded staging volume: no 1m cap and no request buffering here.
    # The service enforces APP_MAX_UPLOAD_BYTES itself; this is only the outer bound (keep them in step).
    location ~ ^/admin/datasets(/uploads)?$ {
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
        client_max_body_size 8200m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location /admin/ {
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }

    # Exports: large native COGs are streamed by the service from disk; never spooled in the gateway.
    location = /api/exports {
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }
    location ^~ /api/exports/ {
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /api/catalog/ {
        limit_except GET { deny all; }
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
        proxy_read_timeout 60s;
    }
    location ^~ /api/app/ {                  # health, readiness, OpenAPI (/api/app/openapi.json), docs
        limit_except GET { deny all; }
        error_page 502 504 = @app_api_unavailable;
        proxy_pass http://$app_api_up$request_uri;
    }

    # ------------------------------------------------------------------ web application
    location = /viewer { return 301 $scheme://$http_host/viewer/; }
    location /viewer/ {
        limit_except GET { deny all; }
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://$viewer_up$upstream_uri;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"no route; see /viewer/, /ogc/, /tiles/, /api/, /auth/, /admin/"}}';
    }
}
