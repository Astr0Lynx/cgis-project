# Main nginx config for the gateway: JSON access logs on stdout, no server version banner.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Query strings are not logged: they can be long (bbox, filters) and are not needed to debug routing.
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    include /etc/nginx/conf.d/*.conf;
}
