# GATEWAY_READ_ACCESS=protected: a signed-in user (cookie session) or a personal access token is
# required. Checked by the application API (GET /auth/verify) through nginx auth_request.
auth_request /_cgis_auth;
error_page 401 = @cgis_401;
error_page 403 = @cgis_403;
error_page 500 502 504 = @app_api_unavailable;
