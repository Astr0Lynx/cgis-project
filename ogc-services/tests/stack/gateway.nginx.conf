# TEST STUB of the gateway routes requested in docs/gateway-request.md.
# Agent 1 owns the real gateway; this file only exists to test route mounting.
server {
    listen 8080;
    server_name _;

    # OGC API (pygeoapi). Prefix stripped; pygeoapi builds links from OGC_PUBLIC_URL.
    location = /ogc { return 301 /ogc/; }
    location /ogc/ {
        proxy_pass http://ogc:5000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Vendor-specific TiTiler routes. Prefix stripped; uvicorn --root-path /tiles
    # plus the forwarded Host make TileJSON URLs point back through the gateway.
    location = /tiles { return 301 /tiles/; }
    location /tiles/ {
        proxy_pass http://tiles:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
