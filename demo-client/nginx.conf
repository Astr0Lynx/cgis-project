# nginx config for the static diagnostic viewer (demo-client/), served behind the gateway at /viewer/
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"viewer"}';
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
