# Small REAL sample (Delhi NCR, ~1.0 x 0.9 degrees) for quick reproducibility checks and A3/A4/A6 integration.
# Same parent lattice as the full run (bbox snapped to the 10-cell lattice anchored at the WorldPop origin),
# so sample pixels are bit-identical to the corresponding full-country pixels.
[paths]
root = "../../.."
work_dir = "data/work/level1-sample-delhi"
out_dir = "data/outputs/level1-sample-delhi"

[run]
name = "india-sample-delhi"
synthetic = false
years = [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011]
bbox = [76.80, 28.10, 77.80, 29.00]
tile_size = 200
workers = 2
max_rss_gb = 4

[parent]
block = 10
zero_weight_fallback = "worldpop"

[inputs.worldpop]
pattern = "data/incoming/worldpop/ind_ppp_{year}.tif"

[inputs.ghsl]
total_glob = "data/incoming/ghsl/GHS_BUILT_S_E{epoch}_GLOBE_R2023A_4326_3ss/*.tif"
nres_glob = "data/incoming/ghsl/GHS_BUILT_S_NRES_E{epoch}_GLOBE_R2023A_4326_3ss/*.tif"
epochs = [2000, 2005, 2010]

[inputs.ghs_pop]
glob = "data/incoming/ghsl/GHS_POP_E{epoch}_GLOBE_R2023A_4326_3ss/*.tif"
epochs = [2000, 2005, 2010, 2015]

[temporal]
policy_2011 = "interpolate_2015"
policy_2011_approval = "approved:maitz18:2026-11-07"   # D-L1-01 option C signed off by the project owner (METHODOLOGY_DECISION.md)
compare_2011_policies = true

[output]
nodata = -99999.0
dataset_prefix = "india-l1-sample-delhi-pop-"
version = 1

[evaluation]
supports = [1, 10, 100]
sample_step = 7

[evaluation.zoom_regions]
delhi = [76.84, 28.40, 77.35, 28.88]

[qa]
mass_rel_tol = 1e-5
mass_abs_tol = 1e-3

[provenance]
zoom_years = [2001, 2011]
reference_product = "GHS-POP R2023A (GHS_POP_E{epoch}_GLOBE_R2023A_4326_3ss V1-0)"

[provenance.licenses]
worldpop = "CC BY 4.0 - WorldPop (www.worldpop.org), doi:10.5258/SOTON/WP00645"
ghsl = "CC BY 4.0 - European Commission, Joint Research Centre (JRC), GHSL Data Package 2023"
