# CyberGIS local stack. See README.md for the architecture and commands.
#   sh infra/scripts/init-env.sh             # .env with random local passwords (never commit .env)
#   docker compose --profile tools build && docker compose up -d --wait
#   docker compose run --rm ingestion seed   # SYNTHETIC fixtures + import (idempotent)
#
# Profiles (COMPOSE_PROFILES in .env, or --profile):
#   (none)   db, migrate, tiles, ogc, processing, viewer, gateway  - the platform
#   app      + application API: app-migrate, app-api, ingest/export workers
#   tools    ingestion CLI (docker compose run --rm ingestion ...)
#   science  Level 1 national model run; run it ALONE on a 16 GB machine
#   e2e      test runner used by tests/run.sh
# Only the gateway publishes a host port; infra/compose.db-port.yaml optionally publishes the database.
# Every long-running service has a mem_limit (overridable in .env). Bind mounts carry ":z" so they
# also work on SELinux hosts (Fedora/RHEL + podman); Docker ignores it elsewhere.

name: ${COMPOSE_PROJECT_NAME:-cgis}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

# Wait for the volume owner fix and the migrations before touching the DB or the volumes.
x-after-setup: &after-setup
  volume-init: {condition: service_completed_successfully}
  migrate: {condition: service_completed_successfully}
x-after-app: &after-app
  volume-init: {condition: service_completed_successfully}
  app-migrate: {condition: service_completed_successfully}

x-pg-required: &pg-required
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

# --- application API (profile "app")
x-app-build-api: &app-build-api
  context: .
  dockerfile: application-api/Dockerfile
  target: api

x-app-common-env: &app-common-env
  APP_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  APP_DEFAULT_DATASET_ACCESS: ${APP_DEFAULT_DATASET_ACCESS:-users}
  APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-8589934592}
  APP_MAX_VECTOR_UPLOAD_BYTES: ${APP_MAX_VECTOR_UPLOAD_BYTES:-268435456}
  APP_STAGING_MAX_TOTAL_BYTES: ${APP_STAGING_MAX_TOTAL_BYTES:-34359738368}
  APP_EXPORT_TTL_SECONDS: ${APP_EXPORT_TTL_SECONDS:-86400}
  APP_EXPORT_MAX_OUTPUT_BYTES: ${APP_EXPORT_MAX_OUTPUT_BYTES:-8589934592}
  APP_EXPORT_MAX_TOTAL_BYTES: ${APP_EXPORT_MAX_TOTAL_BYTES:-34359738368}
  APP_MIN_FREE_BYTES: ${APP_MIN_FREE_BYTES:-2147483648}
  APP_GDAL_CACHEMAX_MB: ${APP_GDAL_CACHEMAX_MB:-256}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}

services:
  # One-shot: hand every named volume to the non-root service user (uid 10001) before first use.
  volume-init:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command:
      - sh
      - -c
      - >-
        set -e;
        mkdir -p /data/assets /data/outputs /data/fixtures;
        chown ${CGIS_SERVICE_UID:-10001}:${CGIS_SERVICE_UID:-10001} /data/assets /data/outputs;
        chmod 0755 /data/assets /data/outputs;
        chown ${CGIS_SERVICE_UID:-10001}:${CGIS_SERVICE_UID:-10001} /data/staging /data/exports;
        chmod 0750 /data/staging /data/exports;
        chmod 0777 /data/fixtures || true;
        echo volume-init ok
    volumes:
      - assets:/data/assets
      - processing-outputs:/data/outputs
      - app-staging:/data/staging
      - app-exports:/data/exports
      - ./data/fixtures:/data/fixtures:z
    restart: "no"
    logging: *logging

  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      <<: *pg-required
    # Sized for national boundaries/catalog on the 16 GB target (raster bytes live in COGs, not here).
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${DB_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - max_connections=${DB_MAX_CONNECTIONS:-100}
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TCP check: the image's temporary init server listens on the Unix socket only, so this
    # does not report ready until initdb has finished and the real server is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: ${DB_MEM_LIMIT:-2g}
    restart: unless-stopped
    logging: *logging

  # One-shot: wait for db, apply database/ migrations, create service login roles (cgis_db.setup).
  migrate:
    build: {context: ./database}
    image: cgis-migrate:local
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INGEST_DB_USER: ${INGEST_DB_USER:?set INGEST_DB_USER in .env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set INGEST_DB_PASSWORD in .env}
      OGC_DB_USER: ${OGC_DB_USER:?set OGC_DB_USER in .env}
      OGC_DB_PASSWORD: ${OGC_DB_PASSWORD:?set OGC_DB_PASSWORD in .env}
      PROCESSING_DB_USER: ${PROCESSING_DB_USER:?set PROCESSING_DB_USER in .env}
      PROCESSING_DB_PASSWORD: ${PROCESSING_DB_PASSWORD:?set PROCESSING_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # Tool container (not started by `up`): docker compose run --rm ingestion <command>
  ingestion:
    build:
      context: ./ingestion
    image: cgis-ingestion:local
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${INGEST_DB_USER}
      PGPASSWORD: ${INGEST_DB_PASSWORD}
      INGESTION_ASSETS_DIR: /data/assets
      INGESTION_FIXTURES_DIR: /data/fixtures
      INGESTION_DB_WAIT_SECONDS: "60"
      GDAL_CACHEMAX: ${INGESTION_GDAL_CACHEMAX_MB:-512}
    volumes:
      - assets:/data/assets                   # read-write ONLY here and in app-ingest-worker
      - ./data/fixtures:/data/fixtures:z      # generated, git-ignored
      - ./data/incoming:/data/incoming:ro,z   # real deliveries: import --manifest /data/incoming/<x>/manifest.json
    depends_on: *after-setup
    mem_limit: ${INGESTION_MEM_LIMIT:-4g}
    logging: *logging

  tiles:
    build:
      context: ./ogc-services/tiler
    image: cgis-tiles:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${OGC_DB_USER}
      POSTGRES_PASSWORD: ${OGC_DB_PASSWORD}
      TILES_ROOT_PATH: /tiles
      CGIS_ASSET_ROOT: /data/assets
      CGIS_CATALOG_CACHE_TTL: ${CGIS_CATALOG_CACHE_TTL:-30}
      WEB_CONCURRENCY: ${TILES_WORKERS:-2}
      GDAL_CACHEMAX: ${TILES_GDAL_CACHEMAX_MB:-200}
    volumes:
      - assets:/data/assets:ro
    depends_on: *after-setup
    mem_limit: ${TILES_MEM_LIMIT:-1536m}
    restart: unless-stopped
    logging: *logging

  ogc:
    build:
      context: ./ogc-services/pygeoapi
    image: cgis-ogc:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${OGC_DB_USER}
      POSTGRES_PASSWORD: ${OGC_DB_PASSWORD}
      OGC_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/ogc
      TILES_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/tiles
      CGIS_TILER_INTERNAL_URL: http://tiles:8000
      OGC_REFRESH_INTERVAL: ${OGC_REFRESH_INTERVAL:-30}
      WSGI_WORKERS: ${OGC_WORKERS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      tiles:
        condition: service_healthy
      # With the "app" profile, admins-only datasets are withheld from publication; that needs the
      # read grant on cgis_app.dataset_access applied by app-migrate.
      app-migrate:
        condition: service_completed_successfully
        required: false
    mem_limit: ${OGC_MEM_LIMIT:-1g}
    restart: unless-stopped
    logging: *logging

  processing:
    build:
      context: ./spatial-processing
      target: runtime
    image: cgis-processing:local
    environment:
      DATABASE_URL: postgresql://${PROCESSING_DB_USER}:${PROCESSING_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      CATALOG_BACKEND: postgres
      JOB_STORE_BACKEND: postgres
      ASSET_ROOT: /data/assets
      OUTPUT_ROOT: /data/outputs
      ROOT_PATH: /api
      MAX_CONCURRENT_JOBS: ${PROCESSING_MAX_CONCURRENT_JOBS:-4}
      OUTPUT_TTL_SECONDS: ${PROCESSING_OUTPUT_TTL_SECONDS:-86400}
      GDAL_CACHEMAX_MB: ${PROCESSING_GDAL_CACHEMAX_MB:-256}
      # Large AOIs: blockwise background jobs (README, processing API)
      ASYNC_WORKERS: ${PROCESSING_ASYNC_WORKERS:-1}
      BLOCK_SIZE: ${PROCESSING_BLOCK_SIZE:-2048}
      ASYNC_MAX_WINDOW_PIXELS: ${PROCESSING_ASYNC_MAX_WINDOW_PIXELS:-2000000000}
      ASYNC_MAX_OUTPUT_BYTES: ${PROCESSING_ASYNC_MAX_OUTPUT_BYTES:-2147483648}
      ASYNC_MAX_JOB_SECONDS: ${PROCESSING_ASYNC_MAX_JOB_SECONDS:-3600}
      ASYNC_MAX_ATTEMPTS: ${PROCESSING_ASYNC_MAX_ATTEMPTS:-2}
      ASYNC_QUEUE_TTL_SECONDS: ${PROCESSING_ASYNC_QUEUE_TTL_SECONDS:-21600}
    volumes:
      - assets:/data/assets:ro
      - processing-outputs:/data/outputs
    depends_on: *after-setup
    mem_limit: ${PROCESSING_MEM_LIMIT:-2g}
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *logging

  # The MapLibre web application (demo-client/), served at /viewer/ by the gateway.
  viewer:
    build: {context: ./demo-client}
    image: cgis-viewer:local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  gateway:
    build:
      context: ./infra/gateway
    image: cgis-gateway:local
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_READ_ACCESS: ${GATEWAY_READ_ACCESS:-public}
    depends_on:
      ogc:
        condition: service_healthy
      tiles:
        condition: service_healthy
      processing:
        condition: service_healthy
      viewer:
        condition: service_healthy
      app-api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # --- Application API (application-api/), profile "app". Privilege layout:
  #   app-api            assets RO, staging RW, exports RO; DB role cgis_app_api (no catalog writes)
  #   app-ingest-worker  assets RW, staging RW;             DB role cgis_app_worker (catalog via cgis_ingest)
  #   app-export-worker  assets RO, exports RW;             DB role cgis_app_worker
  # One-shot: cgis_app schema + login roles (owner credentials), then the APP_BOOTSTRAP_* accounts.
  # The service refuses placeholder or short passwords (sh infra/scripts/init-env.sh fills them).
  app-migrate:
    build: *app-build-api
    image: cgis-app-api:local
    profiles: ["app"]
    command: ["sh", "-c", "cgis-app migrate && cgis-app bootstrap"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      APP_WORKER_DB_USER: ${APP_WORKER_DB_USER:-}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_USER_USERNAME: ${APP_BOOTSTRAP_USER_USERNAME:-}
      APP_BOOTSTRAP_USER_PASSWORD: ${APP_BOOTSTRAP_USER_PASSWORD:-}
      APP_BOOTSTRAP_RESET_PASSWORDS: ${APP_BOOTSTRAP_RESET_PASSWORDS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    logging: *logging

  app-api:
    build: *app-build-api
    image: cgis-app-api:local
    profiles: ["app"]
    environment:
      <<: *app-common-env
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-}:${APP_DB_PASSWORD:-}@db:5432/${POSTGRES_DB}
      APP_TRUST_PROXY_HEADERS: "true"          # only the gateway can reach this service
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-28800}
      APP_SESSION_IDLE_SECONDS: ${APP_SESSION_IDLE_SECONDS:-3600}
      APP_HTTP_WORKERS: ${APP_HTTP_WORKERS:-2}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - app-staging:/data/staging
      - assets:/data/assets:ro
      - app-exports:/data/exports:ro
    depends_on: *after-app
    mem_limit: ${APP_API_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging: *logging

  app-ingest-worker:
    build:
      context: .
      dockerfile: application-api/Dockerfile
      target: ingest-worker
    image: cgis-app-ingest-worker:local
    profiles: ["app"]
    environment:
      <<: *app-common-env
      APP_DATABASE_URL: postgresql://${APP_WORKER_DB_USER:-}:${APP_WORKER_DB_PASSWORD:-}@db:5432/${POSTGRES_DB}
    volumes:
      - app-staging:/data/staging
      - assets:/data/assets                    # the only app service that writes assets
    depends_on: *after-app
    healthcheck:   # workers serve no HTTP: alive = poll loop or job heartbeat touched its file recently
      test: ["CMD", "python", "-m", "cgis_app", "worker-health", "--max-age", "120"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: ${APP_INGEST_MEM_LIMIT:-2g}
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  app-export-worker:
    build: *app-build-api
    image: cgis-app-api:local
    profiles: ["app"]
    command: ["cgis-app", "worker", "--queue", "export"]
    environment:
      <<: *app-common-env
      APP_DATABASE_URL: postgresql://${APP_WORKER_DB_USER:-}:${APP_WORKER_DB_PASSWORD:-}@db:5432/${POSTGRES_DB}
      APP_EXPORT_MAX_SECONDS: ${APP_EXPORT_MAX_SECONDS:-3600}
    volumes:
      - assets:/data/assets:ro
      - app-exports:/data/exports
    depends_on: *after-app
    healthcheck:
      test: ["CMD", "python", "-m", "cgis_app", "worker-health", "--max-age", "120"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: ${APP_EXPORT_MEM_LIMIT:-1536m}
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # Level 1 national model (science/level1/), profile "science"; run it ALONE:
  #   docker compose stop && docker compose --profile science run --rm level1 run --config science/level1/config/india_full.toml
  # The pipeline also self-limits (run.max_rss_gb=12). data/ is a bind mount, never build context.
  level1:
    build:
      context: .
      dockerfile: science/level1/Dockerfile
    image: cgis-level1:local
    profiles: ["science"]
    volumes:
      - ./data:/repo/data:z
    mem_limit: ${LEVEL1_MEM_LIMIT:-14g}
    command: ["run", "--config", "science/level1/config/india_full.toml"]
    logging: *logging

  # End-to-end test runner (profile e2e, never started by `up`); driven by tests/run.sh e2e.
  e2e:
    build: {context: ./tests/e2e}
    image: cgis-e2e:local
    profiles: ["e2e"]
    environment:
      CGIS_GATEWAY_URL: http://gateway:8080
      CGIS_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CGIS_FIXTURES_DIR: /data/fixtures
      CGIS_E2E_STATE_DIR: /data/fixtures/e2e
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INGEST_DB_USER: ${INGEST_DB_USER}
      OGC_DB_USER: ${OGC_DB_USER}
      PROCESSING_DB_USER: ${PROCESSING_DB_USER}
    volumes:
      - ./data/fixtures:/data/fixtures:z
    depends_on:
      gateway: {condition: service_healthy}
    logging: *logging

volumes:
  pgdata: {}               # PostgreSQL cluster (catalog, geo, ops, cgis_app)
  assets: {}               # COG/vector assets written by ingestion, read-only elsewhere
  processing-outputs: {}   # clip/export results of the processing API
  app-staging: {}          # admin uploads awaiting validation/publication (profile app)
  app-exports: {}          # export job outputs, expire after APP_EXPORT_TTL_SECONDS (profile app)
