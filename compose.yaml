# CyberGIS Phase 2 — local Docker Compose stack (owner: Agent 1, infrastructure).
#
#   cp .env.example .env   # or: sh infra/scripts/init-env.sh (generates random local passwords)
#   docker compose up -d --build --wait
#   docker compose run --rm ingestion seed     # SYNTHETIC fixtures + import (idempotent)
#
# Only the gateway publishes a host port (127.0.0.1:8080 by default). The database stays private
# to the Compose network; see infra/compose.db-port.yaml for an opt-in development port.
# Service names are an interface contract (contracts/ARCHITECTURE.md): db, ingestion, ogc, tiles,
# processing, gateway, viewer. Service code lives in each owner's module directory.

name: ${COMPOSE_PROJECT_NAME:-cgis}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-pg-required: &pg-required
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  # One-shot: give the named volumes to the non-root service user (uid 10001) before any service
  # mounts them. Without this, whichever container mounts a fresh volume first decides its owner.
  volume-init:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command:
      - sh
      - -c
      - >-
        set -e;
        mkdir -p /data/assets /data/outputs /data/fixtures;
        chown ${CGIS_SERVICE_UID:-10001}:${CGIS_SERVICE_UID:-10001} /data/assets /data/outputs;
        chmod 0755 /data/assets /data/outputs;
        chmod 0777 /data/fixtures || true;
        echo volume-init ok
    volumes:
      - assets:/data/assets
      - processing-outputs:/data/outputs
      - ./data/fixtures:/data/fixtures
    restart: "no"
    logging: *logging

  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      <<: *pg-required
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TCP check: the image's temporary init server listens on the Unix socket only, so this
    # does not report ready until initdb has finished and the real server is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # One-shot: Agent 2's migrations (python -m cgis_db migrate up), then the login roles for the
  # services (infra/db/provision_roles.py). Safe to run repeatedly.
  migrate:
    build:
      context: .
      dockerfile: infra/migrate/Dockerfile
    image: cgis-migrate:local
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INGEST_DB_USER: ${INGEST_DB_USER:?set INGEST_DB_USER in .env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set INGEST_DB_PASSWORD in .env}
      OGC_DB_USER: ${OGC_DB_USER:?set OGC_DB_USER in .env}
      OGC_DB_PASSWORD: ${OGC_DB_PASSWORD:?set OGC_DB_PASSWORD in .env}
      PROCESSING_DB_USER: ${PROCESSING_DB_USER:?set PROCESSING_DB_USER in .env}
      PROCESSING_DB_PASSWORD: ${PROCESSING_DB_PASSWORD:?set PROCESSING_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # Tool container (not started by `up`): docker compose run --rm ingestion <command>
  ingestion:
    build:
      context: ./ingestion
    image: cgis-ingestion:local
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${INGEST_DB_USER}
      PGPASSWORD: ${INGEST_DB_PASSWORD}
      INGESTION_ASSETS_DIR: /data/assets
      INGESTION_FIXTURES_DIR: /data/fixtures
      INGESTION_DB_WAIT_SECONDS: "60"
    volumes:
      - assets:/data/assets                 # read-write ONLY here
      - ./data/fixtures:/data/fixtures      # generated, git-ignored
      # Phase 1 deliveries (ingestion/docs/PHASE1_HANDOFF.md): put <delivery>/manifest.json under
      # ./data/incoming/ and run `docker compose run --rm ingestion import --manifest /data/incoming/<delivery>/manifest.json`
      - ./data/incoming:/data/incoming:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    logging: *logging

  tiles:
    build:
      context: ./ogc-services/tiler
    image: cgis-tiles:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${OGC_DB_USER}
      POSTGRES_PASSWORD: ${OGC_DB_PASSWORD}
      TILES_ROOT_PATH: /tiles
      CGIS_ASSET_ROOT: /data/assets
      CGIS_CATALOG_CACHE_TTL: ${CGIS_CATALOG_CACHE_TTL:-30}
      WEB_CONCURRENCY: ${TILES_WORKERS:-2}
    volumes:
      - assets:/data/assets:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  ogc:
    build:
      context: ./ogc-services/pygeoapi
    image: cgis-ogc:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${OGC_DB_USER}
      POSTGRES_PASSWORD: ${OGC_DB_PASSWORD}
      OGC_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/ogc
      TILES_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/tiles
      CGIS_TILER_INTERNAL_URL: http://tiles:8000
      OGC_REFRESH_INTERVAL: ${OGC_REFRESH_INTERVAL:-30}
      WSGI_WORKERS: ${OGC_WORKERS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      tiles:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  processing:
    build:
      context: ./spatial-processing
      target: runtime
    image: cgis-processing:local
    environment:
      DATABASE_URL: postgresql://${PROCESSING_DB_USER}:${PROCESSING_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      CATALOG_BACKEND: postgres
      JOB_STORE_BACKEND: postgres
      ASSET_ROOT: /data/assets
      OUTPUT_ROOT: /data/outputs
      ROOT_PATH: /api
      MAX_CONCURRENT_JOBS: ${PROCESSING_MAX_CONCURRENT_JOBS:-4}
      OUTPUT_TTL_SECONDS: ${PROCESSING_OUTPUT_TTL_SECONDS:-86400}
    volumes:
      - assets:/data/assets:ro
      - processing-outputs:/data/outputs
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Static diagnostic viewer (demo-client/, owned by Agent 6), served at /viewer/ by the gateway.
  viewer:
    build:
      context: ./demo-client
      dockerfile_inline: |
        FROM nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        COPY --from=infra default.conf /etc/nginx/conf.d/default.conf
        COPY . /usr/share/nginx/html/
      additional_contexts:
        infra: ./infra/viewer
    image: cgis-viewer:local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *logging

  gateway:
    build:
      context: ./infra/gateway
    image: cgis-gateway:local
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      ogc:
        condition: service_healthy
      tiles:
        condition: service_healthy
      processing:
        condition: service_healthy
      viewer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata: {}               # PostgreSQL cluster (catalog, geo, ops)
  assets: {}               # COG/vector assets written by ingestion, read-only elsewhere
  processing-outputs: {}   # clip/export results
