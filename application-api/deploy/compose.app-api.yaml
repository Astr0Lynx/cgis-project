# Application API services as a Compose OVERLAY on the root stack (owner of the root files: Agent 4).
# It adds services and volumes and swaps in the proposed gateway configuration, without editing
# compose.yaml or infra/. Agent 4 is asked to fold this into the root stack (CHANGE_REQUEST_FOR_AGENT4.md).
#
#   sh infra/scripts/init-env.sh && sh application-api/scripts/init-env.sh    # .env with random secrets
#   docker compose -f compose.yaml -f application-api/deploy/compose.app-api.yaml --profile tools build
#   docker compose -f compose.yaml -f application-api/deploy/compose.app-api.yaml up -d --wait
#
# Paths are relative to the project directory (the directory of compose.yaml).
# Privilege layout (no Docker socket anywhere):
#   app-api            assets RO, staging RW, exports RO; DB role cgis_app_api (no catalog writes)
#   app-ingest-worker  assets RW, staging RW;             DB role cgis_app_worker (catalog via cgis_ingest)
#   app-export-worker  assets RO, exports RW;             DB role cgis_app_worker

x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-build-api: &app-build-api
  context: .
  dockerfile: application-api/Dockerfile
  target: api

x-app-common-env: &app-common-env
  APP_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  APP_DEFAULT_DATASET_ACCESS: ${APP_DEFAULT_DATASET_ACCESS:-users}
  APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-8589934592}
  APP_MAX_VECTOR_UPLOAD_BYTES: ${APP_MAX_VECTOR_UPLOAD_BYTES:-268435456}
  APP_STAGING_MAX_TOTAL_BYTES: ${APP_STAGING_MAX_TOTAL_BYTES:-34359738368}
  APP_EXPORT_TTL_SECONDS: ${APP_EXPORT_TTL_SECONDS:-86400}
  APP_EXPORT_MAX_OUTPUT_BYTES: ${APP_EXPORT_MAX_OUTPUT_BYTES:-8589934592}
  APP_EXPORT_MAX_TOTAL_BYTES: ${APP_EXPORT_MAX_TOTAL_BYTES:-34359738368}
  APP_MIN_FREE_BYTES: ${APP_MIN_FREE_BYTES:-2147483648}
  APP_GDAL_CACHEMAX_MB: ${APP_GDAL_CACHEMAX_MB:-256}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}

services:
  # One-shot: hand the new volumes to the non-root service user (uid 10001).
  app-volume-init:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["sh", "-c", "chown 10001:10001 /data/staging /data/exports && chmod 0750 /data/staging /data/exports"]
    volumes:
      - app-staging:/data/staging
      - app-exports:/data/exports
    restart: "no"
    logging: *app-logging

  # One-shot: cgis_app schema + login roles (owner credentials), then the APP_BOOTSTRAP_* accounts.
  app-migrate:
    build: *app-build-api
    image: cgis-app-api:local
    command: ["sh", "-c", "cgis-app migrate && cgis-app bootstrap"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env (sh application-api/scripts/init-env.sh)}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_WORKER_DB_USER: ${APP_WORKER_DB_USER:?set APP_WORKER_DB_USER in .env}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?set APP_WORKER_DB_PASSWORD in .env}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_USER_USERNAME: ${APP_BOOTSTRAP_USER_USERNAME:-}
      APP_BOOTSTRAP_USER_PASSWORD: ${APP_BOOTSTRAP_USER_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    logging: *app-logging

  app-api:
    build: *app-build-api
    image: cgis-app-api:local
    environment:
      <<: *app-common-env
      APP_DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_TRUST_PROXY_HEADERS: "true"          # only the gateway can reach this service
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-28800}
      APP_SESSION_IDLE_SECONDS: ${APP_SESSION_IDLE_SECONDS:-3600}
      APP_HTTP_WORKERS: ${APP_HTTP_WORKERS:-2}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - app-staging:/data/staging
      - assets:/data/assets:ro
      - app-exports:/data/exports:ro
    depends_on:
      app-volume-init:
        condition: service_completed_successfully
      app-migrate:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped
    logging: *app-logging

  app-ingest-worker:
    build:
      context: .
      dockerfile: application-api/Dockerfile
      target: ingest-worker
    image: cgis-app-ingest-worker:local
    environment:
      <<: *app-common-env
      APP_DATABASE_URL: postgresql://${APP_WORKER_DB_USER}:${APP_WORKER_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - app-staging:/data/staging
      - assets:/data/assets                    # the only app service that writes assets
    depends_on:
      volume-init:
        condition: service_completed_successfully
      app-volume-init:
        condition: service_completed_successfully
      app-migrate:
        condition: service_completed_successfully
    healthcheck:   # workers serve no HTTP: alive = poll loop or job heartbeat touched its file recently
      test: ["CMD", "python", "-m", "cgis_app", "worker-health", "--max-age", "120"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 2g
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *app-logging

  app-export-worker:
    build: *app-build-api
    image: cgis-app-api:local
    command: ["cgis-app", "worker", "--queue", "export"]
    environment:
      <<: *app-common-env
      APP_DATABASE_URL: postgresql://${APP_WORKER_DB_USER}:${APP_WORKER_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_EXPORT_MAX_SECONDS: ${APP_EXPORT_MAX_SECONDS:-3600}
    volumes:
      - assets:/data/assets:ro
      - app-exports:/data/exports
    depends_on:
      app-volume-init:
        condition: service_completed_successfully
      app-migrate:
        condition: service_completed_successfully
    healthcheck:   # workers serve no HTTP: alive = poll loop or job heartbeat touched its file recently
      test: ["CMD", "python", "-m", "cgis_app", "worker-health", "--max-age", "120"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 1536m
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *app-logging

  # Proposed gateway routes for /auth, /admin, /api/exports, /api/catalog, /api/app (CHANGE_REQUEST_FOR_AGENT4.md).
  gateway:
    volumes:
      - ./application-api/deploy/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-api:
        condition: service_healthy
        restart: true   # follows `docker compose restart app-api`; after a rebuild/recreate of app-api run
                        # `docker compose restart gateway` (nginx resolves upstream IPs at start-up; see CR R6)

volumes:
  app-staging: {}   # admin uploads awaiting validation/publication
  app-exports: {}   # export job outputs (expire after APP_EXPORT_TTL_SECONDS)
