# PROPOSED gateway configuration = infra/gateway/default.conf (Agent 4) + the application API routes
# (Agent 5, marked "application API"). Everything else is unchanged. Owner of the real file: Agent 4; see
# application-api/CHANGE_REQUEST_FOR_AGENT4.md. Tested by application-api/tests/test_gateway.py.
#
# Public routes (gateway :8080). Prefixes are stripped before proxying, and the client's Host header
# is forwarded so upstreams build links back through the gateway.
#
#   /auth/  /admin/  /api/exports  /api/catalog/  /api/app/  -> app-api:8000   (application API, NOT stripped)
#   /ogc/    -> ogc:5000         OGC API (pygeoapi): Features, Tiles, OpenAPI          GET/HEAD only
#   /tiles/  -> tiles:8000       TiTiler, vendor-specific raster routes                GET/HEAD only
#   /api/    -> processing:8000  custom processing API (clip, zonal statistics, jobs, downloads)
#   /viewer/ -> viewer:8080      static diagnostic viewer
#   /        -> 302 /viewer/
#   /healthz                     gateway liveness (does not check upstreams)

# The upstream path is taken from the RAW request URI ($request_uri), not nginx's decoded copy, so
# percent-encoding (e.g. %2F inside an id) and the query string reach the service unchanged.
map $request_uri $upstream_uri {
    "~^/(?:ogc|tiles|api|viewer)(?<rest>/[^?]*(?:\?.*)?)$"  $rest;
    default  "";
}
# Raw dot-segments ("/../", "/./", or their %2e forms) are refused instead of forwarded.
map $request_uri $dot_segment {
    "~*(?:^|/)(?:\.|%2e){1,2}(?:/|\?|$)"  1;
    default  0;
}

upstream ogc_up        { server ogc:5000;        keepalive 16; }
upstream tiles_up      { server tiles:8000;      keepalive 16; }
upstream processing_up { server processing:8000; keepalive 16; }
upstream viewer_up     { server viewer:8080;     keepalive 4; }
upstream app_api_up    { server app-api:8000;    keepalive 16; }   # application API

server {
    listen 8080 default_server;
    server_name _;

    # Redirects are absolute and built from the client's own Host header (which carries the published
    # port), so they work on any host port. Relative Locations are not followed by QGIS's OGC API -
    # Features provider when a user enters ".../ogc" without the trailing slash.
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    # application API: the real client address for login throttling. Set here (server level) because a
    # proxy_set_header inside a location would drop the inherited Host/X-Forwarded-* headers above.
    proxy_set_header X-Real-IP $remote_addr;

    client_max_body_size 1m;

    if ($dot_segment) {
        return 400 '{"error":{"code":"BAD_PATH","message":"dot-segments are not allowed in paths"}}';
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location = / { return 302 $scheme://$http_host/viewer/; }

    location = /ogc { return 301 $scheme://$http_host/ogc/; }
    location /ogc/ {
        limit_except GET { deny all; }      # GET implies HEAD
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://ogc_up$upstream_uri;
        proxy_read_timeout 60s;
    }

    location = /tiles { return 301 $scheme://$http_host/tiles/; }
    location /tiles/ {
        limit_except GET { deny all; }
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://tiles_up$upstream_uri;
        proxy_read_timeout 60s;
    }

    location = /api { return 301 $scheme://$http_host/api/; }
    location /api/ {
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://processing_up$upstream_uri;
        client_max_body_size 1m;            # matches the processing service's MAX_REQUEST_BYTES default
        proxy_read_timeout 150s;            # longer than the processing job time limit
    }

    # ---------------------------------------------------------------- application API (Agent 5)
    # The service's routes ARE the public paths, so the raw request URI is forwarded unchanged (no prefix
    # strip). Authentication, roles, CSRF and Origin checks are enforced by the service on every route.
    location = /auth { return 301 $scheme://$http_host/auth/me; }
    location ^~ /auth/ {
        proxy_pass http://app_api_up;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # Admin uploads stream straight to the service's bounded staging volume: no 1m cap, no buffering of the
    # request body in the gateway. The service enforces APP_MAX_UPLOAD_BYTES itself; this is the outer bound.
    location = /admin/datasets/uploads {
        proxy_pass http://app_api_up;
        client_max_body_size 8200m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location = /admin/datasets {           # GET list; POST is an alias of /admin/datasets/uploads
        proxy_pass http://app_api_up;
        client_max_body_size 8200m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location ^~ /admin/ {
        proxy_pass http://app_api_up;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }

    # Exports: large native COGs are streamed by the service from disk; do not spool them in the gateway.
    location = /api/exports { proxy_pass http://app_api_up; client_max_body_size 1m; proxy_read_timeout 60s; }
    location ^~ /api/exports/ {
        proxy_pass http://app_api_up;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /api/catalog/ {
        limit_except GET { deny all; }
        proxy_pass http://app_api_up;
        proxy_read_timeout 60s;
    }
    location ^~ /api/app/ {               # health, readiness, OpenAPI (/api/app/openapi.json), docs
        limit_except GET { deny all; }
        proxy_pass http://app_api_up;
    }
    # ---------------------------------------------------------------- end application API

    location = /viewer { return 301 $scheme://$http_host/viewer/; }
    location /viewer/ {
        limit_except GET { deny all; }
        if ($upstream_uri = "") { return 400 '{"error":{"code":"BAD_PATH","message":"unsupported request path"}}'; }
        proxy_pass http://viewer_up$upstream_uri;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"no route; see /viewer/, /ogc/, /tiles/, /api/, /auth/, /admin/"}}';
    }
}
